[project]
name = "harbourline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1", "reportlab>=4"]
ai = ["mlflow[databricks]>=3.4", "databricks-agents>=1.0", "databricks-sdk>=0.142", "openai>=1.40", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbourline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
